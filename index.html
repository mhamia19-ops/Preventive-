async function generateOrderWithAI(){
  const T_ = t();
  const prompt = STATE.ui.aiPrompt.trim();
  if(!prompt){
    STATE.ui.aiError = T_.aiFillPromptFirst;
    render();
    return;
  }
  STATE.ui.aiLoading = true;
  STATE.ui.aiError = "";
  render();

  const linesContext = STATE.lines.map(line=>{
    const machines = STATE.machines.filter(m=>m.lineId===line.id).map(m=>m.name).join(", ") || "aucune machine enregistrée";
    return "- "+line.name+": "+machines;
  }).join("\n");
  const techContext = STATE.users.filter(u=>u.role==="technician").map(u=>"- "+u.name).join("\n");
  const todayStr = new Date().toISOString().slice(0,10);

  const systemPrompt =
    "Tu es un assistant qui transforme une demande en langage naturel en un ordre de maintenance préventive structuré pour une usine. " +
    "Réponds UNIQUEMENT avec un objet JSON valide, sans aucun texte avant ou après, sans balises markdown, sans backticks. " +
    "Le JSON doit respecter EXACTEMENT ce schéma:\n" +
    '{"title": string, "description": string, "priority": "low"|"medium"|"high", "intervalDays": number, "dueInDays": number, "technicianName": string|null, "exemptWeekdays": [number], "lines": [{"lineName": string, "restWeekdays": [number], "machines": [{"machineName": string, "restWeekdays": [number], "steps": [string]}]}], "sections": [{"title": string, "steps": [string]}]}\n' +
    "Règles:\n" +
    "- title et description en français, clairs et professionnels.\n" +
    "- L'ordre est structuré ainsi : ligne → machines → étapes. Pour chaque ligne concernée, ajoute un objet dans \"lines\" avec lineName = nom EXACT de la ligne ; pour chaque machine concernée de cette ligne, ajoute un objet dans \"machines\" avec machineName = nom EXACT de la machine et, dans \"steps\", les actions à effectuer sur CETTE machine (concrètes, détaillées et réalistes, sans répéter le nom de la machine).\n" +
    "- Si la demande vise toutes les machines d'une ligne, inclus toutes ses machines. Si elle en exclut ou n'en vise que certaines, inclus uniquement celles concernées. Si elle ne vise qu'une machine, mets uniquement sa ligne avec cette seule machine.\n" +
    "- \"sections\" sert uniquement aux étapes générales qui ne concernent aucune machine précise (ex : nettoyage de l'atelier). Sinon mets []. Si la demande est générique et ne cite aucune ligne ni machine, laisse \"lines\" vide et utilise une section avec title \"\" et des étapes détaillées.\n" +
    "- Jours de la semaine : 0=dimanche, 1=lundi, 2=mardi, 3=mercredi, 4=jeudi, 5=vendredi, 6=samedi. exemptWeekdays = jours où l'ordre entier n'a PAS lieu (ex : \"sauf le week-end\" => [6,0]). restWeekdays d'une ligne = jours de repos de cette ligne uniquement ; restWeekdays d'une machine = jours de repos de cette machine uniquement. Mets [] si rien n'est précisé, et n'utilise ces champs que si l'ordre est récurrent.\n" +
    "- technicianName doit correspondre EXACTEMENT au nom d'un technicien de la liste fournie si mentionné ou déductible, sinon null.\n" +
    "- intervalDays est le nombre de jours entre deux occurrences si l'ordre est récurrent (ex: quotidien=1, hebdomadaire=7, bihebdomadaire=14, mensuel=30, ou tout autre nombre explicitement demandé). Mets 0 si l'ordre est ponctuel (une seule fois, pas de récurrence).\n" +
    "- dueInDays est le nombre de jours avant la première échéance (par défaut 7 si non précisé).\n" +
    "- Utilise uniquement les lignes et machines listées dans le contexte, ne pas en inventer d'autres.\n\n" +
    "Lignes et machines disponibles:\n"+linesContext+"\n\n" +
    "Techniciens disponibles:\n"+techContext+"\n\n" +
    "Date du jour: "+todayStr;

  try{
    if(!sb) throw { kind:"network", detail:"no supabase client" };

    const { data, error } = await sb.functions.invoke("generate-order", {
      body: { prompt, systemPrompt }
    });

    if(error){
      console.error("AI order generation: function call failed", error);
      // When the function itself responds with a non-2xx status (403, 500,
      // 502...), supabase-js puts that response on error.context instead of
      // data — read it so we show the *real* reason, not a generic message.
      if(error.context && typeof error.context.json === "function"){
        let body = null;
        try{ body = await error.context.json(); }catch(parseErr){}
        throw { kind:"http", status: error.context.status || "", detail: (body && body.error) || error.message };
      }
      // No context at all means the request never reached the function —
      // that's the genuine "no connection" case.
      throw { kind:"network", detail: error.message };
    }
    if(data && data.error){
      console.error("AI order generation: server returned an error", data);
      throw { kind:"http", status: data.status || "", detail: data.error };
    }
    if(!data || !data.result){
      console.error("AI order generation: no result in response", data);
      throw { kind:"parse", detail:"no result" };
    }
    applyAIResult(data.result);
  } catch(err){
    STATE.ui.aiLoading = false;
    if(err && err.kind==="network"){
      STATE.ui.aiError = T_.aiErrorNetwork;
    } else if(err && err.kind==="http"){
      STATE.ui.aiError = T_.aiErrorHttp + (err.status ? " (HTTP "+err.status+")" : "") + (err.detail ? " — "+err.detail : "");
    } else {
      STATE.ui.aiError = T_.aiErrorParse;
    }
    render();
  }
}

function aiNorm(x){ return normalizeHeader(String(x||"")); }
function aiFindLine(name){
  const n = aiNorm(name);
  if(!n) return null;
  return STATE.lines.find(l=>aiNorm(l.name)===n) || STATE.lines.find(l=>aiNorm(l.name).includes(n) || n.includes(aiNorm(l.name))) || null;
}
function aiFindMachine(name, line){
  const n = aiNorm(name);
  if(!n) return null;
  const pool = line ? STATE.machines.filter(m=>m.lineId===line.id) : STATE.machines;
  return pool.find(m=>aiNorm(m.name)===n) || pool.find(m=>aiNorm(m.name).includes(n) || n.includes(aiNorm(m.name))) || null;
}
function aiWeekdays(arr){
  return Array.from(new Set((Array.isArray(arr)?arr:[]).map(Number).filter(d=>Number.isInteger(d) && d>=0 && d<=6)));
}
function applyAIResult(parsed){
  const validPriority = ["low","medium","high"];
  const priority = validPriority.includes(parsed.priority) ? parsed.priority : "medium";
  const intervalDays = Number.isFinite(parsed.intervalDays) && parsed.intervalDays>0 ? Math.round(parsed.intervalDays) : 0;
  const dueInDays = Number.isFinite(parsed.dueInDays) ? parsed.dueInDays : 7;
  const dueDate = new Date(Date.now() + dueInDays*86400000).toISOString().slice(0,10);
  const technicianId = parsed.technicianName ? (guessTechnicianId(parsed.technicianName) || "") : "";

  // lines -> machines -> steps (names from the AI are matched to your real lines/machines)
  const lineIds = [], machineSteps = {}, lineExemptions = {}, machineExemptions = {};
  const strayLines = [];   // steps whose machine could not be matched: kept as general steps
  (Array.isArray(parsed.lines) ? parsed.lines : []).forEach(ln=>{
    const line = aiFindLine(ln && ln.lineName);
    if(line && !lineIds.includes(line.id)) lineIds.push(line.id);
    if(line && intervalDays>0){
      const wd = aiWeekdays(ln.restWeekdays);
      if(wd.length) lineExemptions[line.id] = { weekdays: wd, dates: [] };
    }
    (Array.isArray(ln && ln.machines) ? ln.machines : []).forEach(mc=>{
      const steps = (Array.isArray(mc && mc.steps) ? mc.steps : []).map(x=>String(x||"").trim()).filter(Boolean);
      if(!steps.length) return;
      const machine = aiFindMachine(mc.machineName, line);
      if(!machine){
        strayLines.push({ title: String((mc && mc.machineName)||"").trim(), steps });
        return;
      }
      const owner = STATE.lines.find(l=>l.id===machine.lineId);
      if(owner && !lineIds.includes(owner.id)) lineIds.push(owner.id);
      (machineSteps[machine.id] = machineSteps[machine.id] || []).push(...steps.map(text=>({ text, machineId:machine.id })));
      if(intervalDays>0){
        const wd = aiWeekdays(mc.restWeekdays);
        if(wd.length) machineExemptions[machine.id] = { weekdays: wd, dates: [] };
      }
    });
  });

  const sections = (Array.isArray(parsed.sections) ? parsed.sections : []).concat(strayLines)
    .filter(s=>Array.isArray(s.steps) && s.steps.length>0)
    .map((s,i)=>({ id:"draft"+Date.now()+"_"+i, title: String(s.title||"").trim(), steps: s.steps.map(x=>String(x||"").trim()).filter(Boolean) }));

  STATE.ui.newOrder = {
    title: String(parsed.title||"").trim(),
    description: String(parsed.description||"").trim(),
    technicianId: technicianId,
    priority: priority,
    intervalDays: intervalDays,
    dueDate: dueDate,
    lineIds: lineIds,
    exemptWeekdays: intervalDays>0 ? aiWeekdays(parsed.exemptWeekdays) : [],
    exemptDates: [],
    lineExemptions: lineExemptions,
    machineExemptions: machineExemptions,
    machineSteps: machineSteps,
    machineStepInput: {},
    sections: sections.length ? sections : [{id:"draft0", title:"", steps:[]}],
    stepInput: {},
    error: "",
    success: false,
    aiGenerated: true,
  };
  STATE.ui.aiLoading = false;
  STATE.ui.showAI = false;
  STATE.ui.orderMode = "new";
  render();
}

/* ============================================================
   VERIFIED WIRING SCHEMAS
   Each circuit is described once as parts + wires. The drawing, the wiring
   list and the automated electrical tests all come from that same data,
   so what you see is exactly what was checked.
============================================================ */
var SCH = (function(){
  var P = 40; // spacing between the 3 poles of a power device
  var COLORS = { L1:"#8B4513", L2:"#111111", L3:"#808080", N:"#1e5bd6", PE:"#2e9e3f", M:"#0f172a", C:"#0f172a", CL:"#8B4513" };
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function n1(v){ return Math.round(v*10)/10; }

  function newDiagram(id, w, h){
    return { id:id, w:w, h:h, terms:{}, parts:[], wires:[], texts:[], sw:[], coils:[], poles:[] };
  }
  function term(d, name, x, y, disp){ d.terms[name] = { x:x, y:y, disp:disp||null }; }
  function node(d, name, x, y){ term(d, name, x, y, null); }
  function text(d, x, y, s, o){
    o = o||{};
    d.texts.push('<text x="'+n1(x)+'" y="'+n1(y)+'" font-size="'+(o.size||11)+'" font-weight="'+(o.bold?700:400)+'" text-anchor="'+(o.anchor||"start")+'" fill="'+(o.fill||"#111")+'" font-family="Arial,Helvetica,sans-serif">'+esc(s)+'</text>');
  }
  function dot(x, y){ return '<circle cx="'+n1(x)+'" cy="'+n1(y)+'" r="2.6" fill="#fff" stroke="#111" stroke-width="1.3"/>'; }
  function line(x1,y1,x2,y2,extra){ return '<line x1="'+n1(x1)+'" y1="'+n1(y1)+'" x2="'+n1(x2)+'" y2="'+n1(y2)+'" stroke="#111" stroke-width="1.6" stroke-linecap="round"'+(extra||"")+'/>'; }

  /* ---------- power symbols (origin = top terminal of pole 1) ---------- */
  function pole3(d, id, x, y, kind, tag, state){
    var out = [];
    for(var i=0;i<3;i++){
      var xi = x+i*P, a = 2*i+1, b = 2*i+2;
      term(d, id+"."+a, xi, y, tag+":"+a);
      term(d, id+"."+b, xi, y+40, tag+":"+b);
      out.push(line(xi,y,xi,y+12));
      out.push(line(xi,y+30,xi,y+40));
      out.push(line(xi,y+30,xi-10,y+12));            // open blade
      if(kind==="breaker"){ out.push(line(xi-14,y+8,xi-6,y+16)); out.push(line(xi-14,y+16,xi-6,y+8)); }
      out.push(dot(xi,y)); out.push(dot(xi,y+40));
      out.push('<text x="'+(xi+5)+'" y="'+(y+9)+'" font-size="9" fill="#555" font-family="Arial">'+a+'</text>');
      out.push('<text x="'+(xi+5)+'" y="'+(y+38)+'" font-size="9" fill="#555" font-family="Arial">'+b+'</text>');
      d.poles.push({ dev:id, a:id+"."+a, b:id+"."+b, driver: kind==="contactor" ? tag : null });
    }
    out.push(line(x-10,y+21,x+2*P-10,y+21,' stroke-dasharray="4 3"'));
    d.parts.push(out.join(""));
    text(d, x-18, y+25, tag, { bold:true, size:12, anchor:"end" });
  }
  function thermal3(d, id, x, y, tag){
    var out = [];
    for(var i=0;i<3;i++){
      var xi = x+i*P, a = 2*i+1, b = 2*i+2;
      term(d, id+"."+a, xi, y, tag+":"+a);
      term(d, id+"."+b, xi, y+40, tag+":"+b);
      out.push(line(xi,y,xi,y+10)); out.push(line(xi,y+30,xi,y+40));
      out.push('<rect x="'+(xi-8)+'" y="'+(y+10)+'" width="16" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>');
      out.push('<path d="M'+xi+' '+(y+12)+' L'+(xi-4)+' '+(y+16)+' L'+(xi+4)+' '+(y+20)+' L'+(xi-4)+' '+(y+24)+' L'+xi+' '+(y+28)+'" fill="none" stroke="#111" stroke-width="1.3"/>');
      out.push(dot(xi,y)); out.push(dot(xi,y+40));
      out.push('<text x="'+(xi+10)+'" y="'+(y+9)+'" font-size="9" fill="#555" font-family="Arial">'+a+'</text>');
      out.push('<text x="'+(xi+10)+'" y="'+(y+38)+'" font-size="9" fill="#555" font-family="Arial">'+b+'</text>');
      d.poles.push({ dev:id, a:id+"."+a, b:id+"."+b, driver:null });   // thermal elements always conduct
    }
    out.push(line(x,y+21,x+2*P,y+21,' stroke-dasharray="4 3"'));
    d.parts.push(out.join(""));
    text(d, x-18, y+25, tag, { bold:true, size:12, anchor:"end" });
  }
  function source3(d, x, y, peX){
    var names = ["L1","L2","L3"], out = [];
    for(var i=0;i<3;i++){
      var xi = x+i*P;
      term(d, "SRC."+names[i], xi, y, names[i]+" (réseau)");
      out.push(dot(xi,y));
      out.push('<text x="'+xi+'" y="'+(y-8)+'" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial">'+names[i]+'</text>');
    }
    term(d, "SRC.PE", peX, y, "PE (réseau)");
    out.push(dot(peX,y));
    out.push('<text x="'+peX+'" y="'+(y-8)+'" font-size="12" font-weight="700" text-anchor="middle" font-family="Arial">PE</text>');
    d.parts.push(out.join(""));
  }
  /* motor: top terminals U1 V1 W1 ; six=true adds bottom terminals W2 U2 V2 ; PE on the frame (left) */
  function motor(d, id, x, y, tag, six, label){
    var r = 46, cx = x+P, cy = y+75, out = [];
    var top = ["U1","V1","W1"], bot = ["W2","U2","V2"];
    out.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#fff" stroke="#111" stroke-width="1.8"/>');
    for(var i=0;i<3;i++){
      var xi = x+i*P, dx = xi-cx, e = Math.sqrt(r*r-dx*dx);
      term(d, id+"."+top[i], xi, y, tag+":"+top[i]);
      out.push(line(xi,y,xi,cy-e)); out.push(dot(xi,y));
      out.push('<text x="'+xi+'" y="'+(y-7)+'" font-size="11" font-weight="700" text-anchor="middle" font-family="Arial">'+top[i]+'</text>');
      if(six){
        var yb = y+150;
        term(d, id+"."+bot[i], xi, yb, tag+":"+bot[i]);
        out.push(line(xi,cy+e,xi,yb)); out.push(dot(xi,yb));
        out.push('<text x="'+(xi-8)+'" y="'+(yb+4)+'" font-size="11" font-weight="700" text-anchor="end" font-family="Arial">'+bot[i]+'</text>');
      }
    }
    term(d, id+".PE", cx-r, cy, tag+":PE (carcasse)");
    out.push(dot(cx-r,cy));
    out.push('<text x="'+cx+'" y="'+(cy-4)+'" font-size="20" font-weight="700" text-anchor="middle" font-family="Arial">M</text>');
    out.push('<text x="'+cx+'" y="'+(cy+12)+'" font-size="13" text-anchor="middle" font-family="Arial">3~</text>');
    if(label) out.push('<text x="'+cx+'" y="'+(cy+30)+'" font-size="10" text-anchor="middle" fill="#444" font-family="Arial">'+esc(label)+'</text>');
    d.parts.push(out.join(""));
    text(d, cx+r+8, cy+4, tag, { bold:true, size:12 });
  }

  /* ---------- control symbols (vertical, top terminal t, bottom terminal b) ---------- */
  /* kind: "aux" (contactor contact) | "pb" (pushbutton) | "thermal" | "timed" ; nc: normally closed */
  function contact(d, id, x, y, o){
    var out = [], nums = o.nums, tag = o.tag;
    term(d, id+".t", x, y, tag+":"+nums[0]);
    term(d, id+".b", x, y+40, tag+":"+nums[1]);
    out.push(line(x,y,x,y+12)); out.push(line(x,y+30,x,y+40));
    if(o.nc){
      out.push(line(x,y+30,x,y+12));
      out.push(line(x-6,y+12,x+6,y+12));
      out.push(line(x-9,y+30,x+9,y+30)); // small bar at pivot, marks "normally closed"
    } else {
      out.push(line(x,y+30,x-10,y+12));
    }
    if(o.kind==="pb"){
      out.push(line(x-4,y+21,x-18,y+21,' stroke-dasharray="3 2"'));
      out.push(line(x-18,y+15,x-18,y+27));
    }
    if(o.kind==="thermal"){
      out.push(line(x-4,y+21,x-14,y+21,' stroke-dasharray="3 2"'));
      out.push('<rect x="'+(x-26)+'" y="'+(y+15)+'" width="12" height="12" fill="#fff" stroke="#111" stroke-width="1.3"/>');
      out.push('<path d="M'+(x-24)+' '+(y+17)+' L'+(x-20)+' '+(y+21)+' L'+(x-24)+' '+(y+25)+'" fill="none" stroke="#111" stroke-width="1.1"/>');
    }
    if(o.kind==="timed"){
      out.push(line(x-4,y+21,x-14,y+21,' stroke-dasharray="3 2"'));
      out.push('<path d="M'+(x-22)+' '+(y+21)+' a6 6 0 0 1 12 0" fill="none" stroke="#111" stroke-width="1.3"/>');
      out.push(line(x-16,y+21,x-16,y+27));
    }
    out.push(dot(x,y)); out.push(dot(x,y+40));
    out.push('<text x="'+(x+5)+'" y="'+(y+9)+'" font-size="9" fill="#555" font-family="Arial">'+nums[0]+'</text>');
    out.push('<text x="'+(x+5)+'" y="'+(y+38)+'" font-size="9" fill="#555" font-family="Arial">'+nums[1]+'</text>');
    d.parts.push(out.join(""));
    text(d, x+14, y+24, tag, { bold:true, size:11 });
    d.sw.push({ id:id, a:id+".t", b:id+".b", nc:!!o.nc, driver:o.driver, kind:o.kind });
  }
  function coil(d, id, x, y, tag, o){
    var out = [];
    term(d, id+".A1", x, y, tag+":A1");
    term(d, id+".A2", x, y+44, tag+":A2");
    out.push(line(x,y,x,y+8)); out.push(line(x,y+36,x,y+44));
    out.push('<rect x="'+(x-16)+'" y="'+(y+8)+'" width="32" height="28" fill="#fff" stroke="#111" stroke-width="1.6"/>');
    if(o && o.timer){ out.push(line(x-16,y+8,x+16,y+36)); }
    out.push(dot(x,y)); out.push(dot(x,y+44));
    out.push('<text x="'+x+'" y="'+(y+26)+'" font-size="11" font-weight="700" text-anchor="middle" font-family="Arial">'+tag+'</text>');
    out.push('<text x="'+(x+5)+'" y="'+(y+7)+'" font-size="9" fill="#555" font-family="Arial">A1</text>');
    out.push('<text x="'+(x+5)+'" y="'+(y+43)+'" font-size="9" fill="#555" font-family="Arial">A2</text>');
    d.parts.push(out.join(""));
    d.coils.push({ id:id, name:tag, a1:id+".A1", a2:id+".A2", timer:!!(o&&o.timer) });
  }
  function rails(d, x1, x2, yTop, yBot, topLabel, botLabel){
    term(d, "RAIL.L1", x1, yTop, topLabel+" (phase commande)");
    term(d, "RAIL.N",  x1, yBot, botLabel+" (neutre commande)");
    d.parts.push(dot(x1,yTop)+dot(x1,yBot));
    text(d, x1-6, yTop-7, topLabel, { bold:true, size:12 });
    text(d, x1-6, yBot+17, botLabel, { bold:true, size:12 });
  }

  /* ---------- wires ---------- */
  /* via: array of [x,y] corners, or "vh" (vertical then horizontal) / "hv" */
  function wire(d, kind, a, b, via){
    var A = d.terms[a], B = d.terms[b];
    if(!A) throw new Error("unknown terminal "+a);
    if(!B) throw new Error("unknown terminal "+b);
    var pts = [[A.x,A.y]];
    if(via==="vh") pts.push([A.x,B.y]);
    else if(via==="hv") pts.push([B.x,A.y]);
    else if(via) via.forEach(function(p){ pts.push([p[0],p[1]]); });
    pts.push([B.x,B.y]);
    // drop duplicate consecutive points
    var clean = [pts[0]];
    for(var i=1;i<pts.length;i++){ var q = clean[clean.length-1]; if(q[0]!==pts[i][0] || q[1]!==pts[i][1]) clean.push(pts[i]); }
    d.wires.push({ kind:kind, a:a, b:b, pts:clean });
  }
  function chain(d, kind, names){ for(var i=0;i<names.length-1;i++) wire(d, kind, names[i], names[i+1]); }

  function segments(w){
    var s = [];
    for(var i=0;i<w.pts.length-1;i++) s.push({ x1:w.pts[i][0], y1:w.pts[i][1], x2:w.pts[i+1][0], y2:w.pts[i+1][1] });
    return s;
  }
  /* crossings between a horizontal segment of one wire and a vertical segment of another (strictly inside both) */
  function crossings(d){
    var out = [];
    d.wires.forEach(function(wa, ia){
      segments(wa).forEach(function(sa){
        if(sa.y1!==sa.y2) return;
        var xa1 = Math.min(sa.x1,sa.x2), xa2 = Math.max(sa.x1,sa.x2);
        d.wires.forEach(function(wb, ib){
          if(ia===ib) return;
          segments(wb).forEach(function(sb){
            if(sb.x1!==sb.x2) return;
            var yb1 = Math.min(sb.y1,sb.y2), yb2 = Math.max(sb.y1,sb.y2);
            if(sb.x1>xa1 && sb.x1<xa2 && sa.y1>yb1 && sa.y1<yb2) out.push({ h:ia, v:ib, x:sb.x1, y:sa.y1 });
          });
        });
      });
    });
    return out;
  }
  function wireColor(k){ return COLORS[k] || "#111"; }
  function wirePath(d, wi, cross){
    var w = d.wires[wi], r = 5, path = "";
    for(var i=0;i<w.pts.length;i++){
      var p = w.pts[i];
      if(i===0){ path += "M"+n1(p[0])+" "+n1(p[1]); continue; }
      var q = w.pts[i-1];
      if(p[1]===q[1]){                       // horizontal: add hops over crossing verticals
        var dir = p[0]>q[0] ? 1 : -1;
        var xs = cross.filter(function(c){ return c.h===wi && c.y===p[1] && c.x>Math.min(p[0],q[0]) && c.x<Math.max(p[0],q[0]); })
                      .map(function(c){ return c.x; }).sort(function(a,b){ return dir*(a-b); });
        xs.forEach(function(cx){ path += " L"+n1(cx-dir*r)+" "+n1(p[1])+" A"+r+" "+r+" 0 0 "+(dir>0?1:0)+" "+n1(cx+dir*r)+" "+n1(p[1]); });
      }
      path += " L"+n1(p[0])+" "+n1(p[1]);
    }
    return '<path d="'+path+'" fill="none" stroke="'+wireColor(w.kind)+'" stroke-width="'+(w.kind==="PE"?2.2:1.9)+'" stroke-linejoin="round"'+(w.kind==="PE"?' stroke-dasharray="7 3"':"")+'/>';
  }
  /* nets: terminals joined by wires (nodes included) */
  function nets(d){
    var parent = {};
    function find(x){ while(parent[x]!==x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    Object.keys(d.terms).forEach(function(k){ parent[k] = k; });
    d.wires.forEach(function(w){ parent[find(w.a)] = find(w.b); });
    var groups = {};
    Object.keys(d.terms).forEach(function(k){ var r = find(k); (groups[r] = groups[r]||[]).push(k); });
    return { find:find, groups:Object.keys(groups).map(function(r){ return groups[r]; }) };
  }
  function render(d){
    var cross = crossings(d);
    var deg = {};
    d.wires.forEach(function(w){ deg[w.a] = (deg[w.a]||0)+1; deg[w.b] = (deg[w.b]||0)+1; });
    var dots = "";
    Object.keys(d.terms).forEach(function(k){ if(!d.terms[k].disp && deg[k]>=3) dots += '<circle cx="'+d.terms[k].x+'" cy="'+d.terms[k].y+'" r="3.4" fill="#111"/>'; });
    var wires = d.wires.map(function(w,i){ return wirePath(d,i,cross); }).join("");
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+d.w+' '+d.h+'"><rect width="'+d.w+'" height="'+d.h+'" fill="#ffffff"/>' +
      wires + dots + d.parts.join("") + d.texts.join("") + '</svg>';
  }
  /* wiring list: one line per electrical net that joins at least two real terminals */
  function wiringList(d){
    var kindOf = {};
    d.wires.forEach(function(w){ kindOf[w.a] = w.kind; kindOf[w.b] = w.kind; });
    var rows = [];
    nets(d).groups.forEach(function(g){
      var real = g.filter(function(k){ return d.terms[k].disp; });
      if(real.length<2) return;
      var kind = kindOf[g[0]] || "C";
      for(var i=0;i<g.length;i++){ if(kindOf[g[i]]){ kind = kindOf[g[i]]; break; } }
      rows.push({ kind:kind, color:wireColor(kind), terms:real.map(function(k){ return d.terms[k].disp; }), ids:real });
    });
    return rows;
  }

  /* ============================================================
     CIRCUITS
  ============================================================ */
  function powerFeed(d, kws){ /* shared top: source -> Q1 */
    source3(d, 110, 44, 40);
    d.parts.push("");
    pole3(d, "Q1", 110, 76, "breaker", "Q1");
    ["L1","L2","L3"].forEach(function(n,i){ wire(d, n, "SRC."+n, "Q1."+(2*i+1)); });
  }
  function motorLabel(p){ return p && p.kw ? (p.kw.replace(".",",")+" kW") : ""; }

  /* ---- 1. Direct start, one direction ---- */
  function dolPower(p){
    var d = newDiagram("dol_power", 300, 440);
    powerFeed(d);
    pole3(d, "KM1", 110, 146, "contactor", "KM1");
    thermal3(d, "F2", 110, 216, "F2");
    motor(d, "M1", 110, 286, "M1", false, motorLabel(p));
    for(var i=0;i<3;i++){
      wire(d, ["L1","L2","L3"][i], "Q1."+(2*i+2), "KM1."+(2*i+1));
      wire(d, "M", "KM1."+(2*i+2), "F2."+(2*i+1));
      wire(d, "M", "F2."+(2*i+2), "M1."+["U1","V1","W1"][i]);
    }
    wire(d, "PE", "SRC.PE", "M1.PE", [[40,361]]);
    return d;
  }
  function dolControl(){
    var d = newDiagram("dol_control", 300, 380);
    rails(d, 40, 250, 40, 340, "L1", "N");
    node(d,"r1",100,40);
    node(d,"b1",100,340);
    contact(d,"F2c",100,60,{tag:"F2",nums:["95","96"],nc:true,kind:"thermal",driver:"F2"});
    contact(d,"S1",100,120,{tag:"S1",nums:["11","12"],nc:true,kind:"pb",driver:"S1"});
    node(d,"a1",100,176); node(d,"a2",150,176);
    contact(d,"S2",100,192,{tag:"S2",nums:["13","14"],nc:false,kind:"pb",driver:"S2"});
    contact(d,"KM1h",150,192,{tag:"KM1",nums:["13","14"],nc:false,kind:"aux",driver:"KM1"});
    node(d,"c1",100,248); node(d,"c2",150,248);
    coil(d,"KM1",100,264,"KM1");
    wire(d,"CL","RAIL.L1","r1",[]); wire(d,"CL","r1","F2c.t");
    wire(d,"C","F2c.b","S1.t");
    wire(d,"C","S1.b","a1"); wire(d,"C","a1","a2"); wire(d,"C","a1","S2.t"); wire(d,"C","a2","KM1h.t");
    wire(d,"C","S2.b","c1"); wire(d,"C","KM1h.b","c2"); wire(d,"C","c2","c1"); wire(d,"C","c1","KM1.A1");
    wire(d,"N","KM1.A2","b1"); wire(d,"N","b1","RAIL.N");
    return d;
  }

  /* ---- 2. Reversing starter ---- */
  function revPower(p){
    var d = newDiagram("rev_power", 380, 520);
    powerFeed(d);
    pole3(d, "KM1", 110, 186, "contactor", "KM1");
    pole3(d, "KM2", 250, 186, "contactor", "KM2");
    thermal3(d, "F2", 110, 296, "F2");
    motor(d, "M1", 110, 366, "M1", false, motorLabel(p));
    // supply side: Q1 outputs feed KM1 directly and KM2 through taps
    var lv = [158,146,134];   // tap levels for L1, L2, L3
    ["L1","L2","L3"].forEach(function(n,i){
      var x = 110+i*P, tx = 250+i*P;
      node(d, "tp"+i, x, lv[i]);
      wire(d, n, "Q1."+(2*i+2), "tp"+i);
      wire(d, n, "tp"+i, "KM1."+(2*i+1));
      wire(d, n, "tp"+i, "KM2."+(2*i+1), [[tx,lv[i]]]);
    });
    // motor side: KM1 straight through, KM2 swaps L1 and L3 (that is what reverses the motor)
    var jl = [264,252,240];   // junction heights on the three F2 inputs (x=110,150,190)
    for(var i=0;i<3;i++){
      node(d, "jn"+i, 110+i*P, jl[i]);
      wire(d, "M", "KM1."+(2*i+2), "jn"+i);
      wire(d, "M", "jn"+i, "F2."+(2*i+1));
      wire(d, "M", "F2."+(2*i+2), "M1."+["U1","V1","W1"][i]);
    }
    wire(d, "M", "KM2.2", "jn2", [[250,jl[2]]]);   // KM2 pole 1 (L1) -> F2 input 5
    wire(d, "M", "KM2.4", "jn1", [[290,jl[1]]]);   // KM2 pole 2 (L2) -> F2 input 3
    wire(d, "M", "KM2.6", "jn0", [[330,jl[0]]]);   // KM2 pole 3 (L3) -> F2 input 1
    wire(d, "PE", "SRC.PE", "M1.PE", [[40,441]]);
    return d;
  }


  /* ---- 2b. Reversing control: double interlock (contactor contacts + pushbutton contacts) ---- */
  function revControl(){
    var d = newDiagram("rev_control", 380, 480);
    rails(d, 40, 340, 40, 440, "L1", "N");
    node(d,"r1",195,40);
    contact(d,"F2c",195,60,{tag:"F2",nums:["95","96"],nc:true,kind:"thermal",driver:"F2"});
    contact(d,"S1",195,120,{tag:"S1",nums:["11","12"],nc:true,kind:"pb",driver:"S1"});
    node(d,"ba1",100,176); node(d,"ba2",150,176); node(d,"n0",195,176); node(d,"bb1",240,176); node(d,"bb2",290,176);
    // forward branch (KM1)
    contact(d,"S2",100,192,{tag:"S2",nums:["13","14"],nc:false,kind:"pb",driver:"S2"});
    contact(d,"KM1h",150,192,{tag:"KM1",nums:["13","14"],nc:false,kind:"aux",driver:"KM1"});
    node(d,"ca1",100,248); node(d,"ca2",150,248);
    contact(d,"S3n",100,264,{tag:"S3",nums:["21","22"],nc:true,kind:"pb",driver:"S3"});
    contact(d,"KM2n",100,320,{tag:"KM2",nums:["21","22"],nc:true,kind:"aux",driver:"KM2"});
    coil(d,"KM1",100,376,"KM1");
    // reverse branch (KM2)
    contact(d,"S3",240,192,{tag:"S3",nums:["13","14"],nc:false,kind:"pb",driver:"S3"});
    contact(d,"KM2h",290,192,{tag:"KM2",nums:["13","14"],nc:false,kind:"aux",driver:"KM2"});
    node(d,"cb1",240,248); node(d,"cb2",290,248);
    contact(d,"S2n",240,264,{tag:"S2",nums:["21","22"],nc:true,kind:"pb",driver:"S2"});
    contact(d,"KM1n",240,320,{tag:"KM1",nums:["21","22"],nc:true,kind:"aux",driver:"KM1"});
    coil(d,"KM2",240,376,"KM2");

  /* ---- 3. Star-delta (6-wire motor) ---- */
  function sdPower(p){
    var d = newDiagram("sd_power", 400, 660);
    powerFeed(d);
    pole3(d, "KM1", 110, 146, "contactor", "KM1");
    thermal3(d, "F2", 110, 216, "F2");
    motor(d, "M1", 110, 336, "M1", true, motorLabel(p));
    pole3(d, "KM3", 270, 330, "contactor", "KM3");   // delta
    pole3(d, "KM2", 110, 566, "contactor", "KM2");   // star
    var tapY = [304,290,276];          // tap heights for T1 (x=110), T2 (150), T3 (190)
    for(var i=0;i<3;i++){
      var x = 110+i*P;
      wire(d, ["L1","L2","L3"][i], "Q1."+(2*i+2), "KM1."+(2*i+1));
      wire(d, "M", "KM1."+(2*i+2), "F2."+(2*i+1));
      node(d, "tp"+i, x, tapY[i]);
      wire(d, "M", "F2."+(2*i+2), "tp"+i);
      wire(d, "M", "tp"+i, "M1."+["U1","V1","W1"][i]);
      wire(d, "M", "tp"+i, "KM3."+(2*i+1), [[270+i*P, tapY[i]]]);
    }
    // delta: U1->W2, V1->U2, W1->V2 ; junctions on the motor's lower terminals
    var jy = [506,522,538];
    var low = ["W2","U2","V2"];
    for(var k=0;k<3;k++){
      var xk = 110+k*P;
      node(d, "jl"+k, xk, jy[k]);
      wire(d, "M", "M1."+low[k], "jl"+k);
      wire(d, "M", "jl"+k, "KM2."+(2*k+1));
      wire(d, "M", "KM3."+(2*k+2), "jl"+k, [[270+k*P, jy[k]]]);
    }
    // star point: KM2 lower terminals tied together
    for(var m=0;m<3;m++){ node(d, "st"+m, 110+m*P, 626); wire(d, "M", "KM2."+(2*m+2), "st"+m); }
    wire(d, "M", "st0", "st1"); wire(d, "M", "st1", "st2");

  function build(circuitId, params){
    var c = CIRCUITS[circuitId];
    if(!c) return null;
    var p = {};
    if(params){
      if(/^[0-9]{1,3}([.,][0-9]{1,2})?$/.test(params.kw||"")) p.kw = String(params.kw).replace(",",".");
      if(/^[0-9]{2,4}$/.test(params.v||"")) p.v = params.v;
    }
    return {
      id: circuitId, name: c.name, notes: c.notes,
      diagrams: c.diagrams.map(function(g){
        var d = g.build(p);
        return { key:g.key, title:TITLES[g.key], svg:render(d), rows:wiringList(d), w:d.w, h:d.h };
      })
    };
  }
  function buildRaw(circuitId, key, params){
    var c = CIRCUITS[circuitId]; if(!c) return null;
    var g = c.diagrams.filter(function(x){ return x.key===key; })[0];
    return g ? g.build(params||{}) : null;
  }

/* ----- text / diagram rendering ----- */
const ASST_FREE_SVG_RE = /```[a-zA-Z]*\s*<svg[\s\S]*?(?:<\/svg>\s*```|$)/gi;
const ASST_TOKEN_RE = /\[\[\s*SCHEMA\s+([a-z_]+)((?:\s+[a-z]+\s*=\s*[0-9.,]+)*)\s*\]\]/gi;
function svgUri(svg){ return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg); }
const asstSchemaCache = {};
function asstSchema(id, kw, v){
  const key = id+"|"+kw+"|"+v;
  if(!(key in asstSchemaCache)) asstSchemaCache[key] = SCH.build(id, { kw:kw, v:v });
  return asstSchemaCache[key];
}
function asstInline(x){
  return esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function asstTextHTML(v){
  v = String(v||"").trim();
  if(!v) return "";
  let html = "", list = null;
  const flush = ()=>{ if(list){ html += "<"+list.t+' dir="auto">'+list.items.map(i=>'<li dir="auto">'+i+"</li>").join("")+"</"+list.t+">"; list = null; } };
  v.split("\n").forEach(line=>{
    const ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/), ul = line.match(/^\s*[-*•]\s+(.*)$/);
    if(ol){ if(!list || list.t!=="ol"){ flush(); list = {t:"ol", items:[]}; } list.items.push(asstInline(ol[2])); }
    else if(ul){ if(!list || list.t!=="ul"){ flush(); list = {t:"ul", items:[]}; } list.items.push(asstInline(ul[1])); }
    else if(!line.trim()){ flush(); }
    else { flush(); html += '<p dir="auto">'+asstInline(line)+"</p>"; }
  });
  flush();
  return '<div class="asst-text">'+html+"</div>";
}
function asstParams(str){
  const o = {};
  String(str||"").replace(/([a-z]+)\s*=\s*([0-9.,]+)/gi, function(_, k, v){ o[k.toLowerCase()] = v; return ""; });
  return o;
}
/* one verified circuit: badge, diagrams, wiring list, notes, reminder */
function asstSchemaHTML(id, paramStr){
  const T_ = t(), lang = STATE.lang==="ar" ? "ar" : "fr";
  const p = asstParams(paramStr);
  const kw = p.kw || "", v = p.v || "";
  const b = asstSchema(id.toLowerCase(), kw, v);
  if(!b){
    return '<div class="asst-schema warn"><p dir="auto"><strong>'+esc(T_.schemaUnknown)+'</strong></p></div>';
  }
  let h = '<div class="asst-schema"><div class="asst-schema-badge">'+esc(T_.schemaVerified)+'</div>' +
    '<div class="asst-schema-name" dir="auto">'+esc(b.name[lang])+'</div>';
  const specs = [];
  if(/^[0-9]{1,3}([.,][0-9]{1,2})?$/.test(kw)) specs.push(kw.replace(".",",")+" kW");
  if(/^[0-9]{2,4}$/.test(v)) specs.push(v+" V");
  if(specs.length) h += '<div class="asst-schema-spec" dir="auto">'+esc(T_.schemaMotor)+' : <bdi dir="ltr">'+esc(specs.join(" – "))+'</bdi></div>';
  b.diagrams.forEach(g=>{
    h += '<p class="asst-schema-title" dir="auto">'+esc(g.title[lang])+'</p>' +
      '<button class="asst-diagram" onclick="openSchemaDiagram(\''+id.toLowerCase()+'\',\''+esc(kw)+'\',\''+esc(v)+'\',\''+g.key+'\')">' +
      '<img src="'+svgUri(g.svg)+'" alt="">' +
      '<span class="asst-diagram-hint">'+icon("zoomIn",11)+esc(T_.assistantTapZoom)+'</span></button>';
  });
  h += '<details class="asst-wiring"><summary>'+esc(T_.schemaWiring)+'</summary>';
  b.diagrams.forEach(g=>{
    h += '<p class="asst-schema-title" dir="auto">'+esc(g.title[lang])+'</p><div class="asst-wire-list" dir="ltr">' +
      g.rows.map(r=>'<div class="asst-wire-row"><span class="asst-wire-dot" style="background:'+r.color+'"></span><span>'+r.terms.map(esc).join(' &#8596; ')+'</span></div>').join("") + '</div>';
  });
  h += '</details>';
  h += '<ul class="asst-schema-notes" dir="auto">'+b.notes[lang].map(n=>'<li>'+esc(n)+'</li>').join("")+'</ul>';
  h += '<p class="asst-schema-warn" dir="auto">'+esc(T_.schemaWarn)+'</p></div>';
  return h;
}
function asstRichHTML(text, mi){
  // markers and any free-hand drawing (which is never shown) are handled in text order
  const re = new RegExp(ASST_TOKEN_RE.source+"|"+ASST_FREE_SVG_RE.source, "gi");
  let out = "", last = 0, m;
  while((m = re.exec(text))){
    out += asstTextHTML(text.slice(last, m.index));
    if(m[1]) out += asstSchemaHTML(m[1], m[2]);
    else out += '<p class="asst-note" dir="auto">'+esc(t().schemaHidden)+'</p>';
    last = re.lastIndex;
    if(m[0].length===0) re.lastIndex++;
  }
  return out + asstTextHTML(text.slice(last));
}

/* ----- photo ----- */
function asstDownscale(file, maxDim){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const k = Math.min(1, maxDim/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width*k)); c.height = Math.max(1, Math.round(img.height*k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function asstPickPhoto(input){
  const f = input.files && input.files[0];
  input.value = "";
  if(!f) return;
  try{
    asst.image = await asstDownscale(f, 1600);
    refreshAsstPreview(); refreshAsstSend();
  }catch(err){
    console.error("MaintOS: assistant photo failed", err);
    asst.error = t().assistantErrGeneric; refreshAsstMsgs();
  }
}

/* ----- voice dictation (browser speech recognition) ----- */
function stopAsstMic(){
  if(asstRecog){ try{ asstRecog.stop(); }catch(e){} asstRecog = null; }
  asst.listening = false; refreshAsstMic();
}
function toggleAsstLang(){ asst.speechLang = asst.speechLang==="ar-DZ" ? "fr-FR" : "ar-DZ"; stopAsstMic(); renderAssistant(); }
function toggleAsstMic(){
  if(asst.listening){ stopAsstMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const r = new SR();
  r.lang = asst.speechLang; r.interimResults = true; r.continuous = false;
  const base = asst.input.trim() ? asst.input.trim()+" " : "";
  r.onresult = e=>{
    let txt = "";
    for(let i=0; i<e.results.length; i++) txt += e.results[i][0].transcript;
    asst.input = base + txt;
    const ta = asstEl("asstInput");
    if(ta){ ta.value = asst.input; asstGrow(ta); }
    refreshAsstSend();
  };
  r.onerror = e=>{
    asst.listening = false; refreshAsstMic();
    if(e && (e.error==="not-allowed" || e.error==="service-not-allowed")){ asst.error = t().assistantMicDenied; refreshAsstMsgs(); }
  };
  r.onend = ()=>{ asst.listening = false; asstRecog = null; refreshAsstMic(); };
  asstRecog = r; asst.listening = true; refreshAsstMic();
  try{ r.start(); }catch(e){ asst.listening = false; asstRecog = null; refreshAsstMic(); }
}

function asstChip(i){
  const T_ = t();
  const p = (T_.assistantChipPrompts||[])[i];
  if(!p){ const f = asstEl("asstFile"); if(f) f.click(); return; }
  asstSend(p);
}
async function asstSend(textOverride){
  if(asst.loading) return;
  const text = String(typeof textOverride==="string" ? textOverride : asst.input).trim();
  if(!text && !asst.image) return;
  stopAsstMic();
  asst.messages.push({ role:"user", text, image:asst.image });
  asst.input = ""; asst.image = null; asst.error = "";
  const ta = asstEl("asstInput");
  if(ta){ ta.value = ""; ta.style.height = "auto"; }
  refreshAsstPreview();
  await asstCall();
}
function asstRetry(){ if(!asst.loading) asstCall(); }
async function asstCall(){
  asst.loading = true; asst.error = "";
  refreshAsstMsgs(); refreshAsstSend();
  try{
    if(!sb || (typeof navigator!=="undefined" && navigator.onLine===false)) throw { kind:"network" };
    const recent = asst.messages.slice(-16);
    // only the 3 most recent photos are sent (keeps requests small)
    const withImg = recent.map((m,i)=>m.image ? i : -1).filter(i=>i>=0).slice(-3);
    const payload = recent.map((m,i)=>{
      const o = { role:m.role, text:m.text||"" };
      if(m.image && withImg.includes(i)){
        const mm = m.image.match(/^data:(image\/[a-z]+);base64,(.+)$/);
        if(mm) o.image = { mime:mm[1], data:mm[2] };
      }
      return o;
    });
    const { data, error } = await sb.functions.invoke("electrical-assistant", { body:{ messages:payload } });
    if(error) throw error;
    if(!data || !data.text) throw new Error(data && data.error ? data.error : "empty");
    asst.messages.push({ role:"model", text:data.text, truncated:!!data.truncated });
  }catch(err){
    console.error("MaintOS: assistant failed", err);
    asst.error = (err && err.kind==="network") ? t().assistantErrNetwork : t().assistantErrGeneric;
  }
  asst.loading = false;
  refreshAsstMsgs(); refreshAsstSend();
}

const QR_PREFIX = "CAPMAINT:machine:";
let scannerStream = null;
let scannerRAF = null;
function scannerOverlayHTML(){

  stopScannerCamera();
  STATE.ui.showScanner = false;
  render();

async function startScannerCamera(){
  const video = document.getElementById("qrVideo");
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    STATE.ui.scanError = t().scanCameraError;
    STATE.ui.showScanner = false;
    render();
    return;
  }
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = scannerStream;
    await video.play();
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const tick = ()=>{
      if(!STATE.ui.showScanner) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(imageData.data, imageData.width, imageData.height);
        if(code && code.data){
          handleScanResult(code.data);
          return;
        }
      }
      scannerRAF = requestAnimationFrame(tick);
    };
    scannerRAF = requestAnimationFrame(tick);
  }catch(err){
    console.error("MaintOS: camera error", err);
    STATE.ui.scanError = t().scanCameraError;
    STATE.ui.showScanner = false;
    render();
  }
}
function stopScannerCamera(){
  if(scannerRAF){ cancelAnimationFrame(scannerRAF); scannerRAF = null; }
  if(scannerStream){ scannerStream.getTracks().forEach(tr=>tr.stop()); scannerStream = null; }
}
function handleScanResult(text){
  stopScannerCamera();
  if(text && text.indexOf(QR_PREFIX) === 0){
    const id = text.slice(QR_PREFIX.length);
    const m = STATE.machines.find(x=>x.id===id);
    if(m){
      STATE.ui.showScanner = false;
      STATE.ui.scanError = "";
      openMachine(id);
      return;
    }
  }
  STATE.ui.scanError = t().scanNotFound;
  STATE.ui.showScanner = false;
  render();
}

  const el = document.getElementById("qrcode-"+machineId);
  if(!el || !window.QRCode) return;
  el.innerHTML = "";
  new QRCode(el, { text: QR_PREFIX + machineId, width: 160, height: 160, colorDark: "#0f172a", colorLight: "#ffffff" });
}

  const el = document.getElementById("qrcode-"+machineId);

  w.document.write(

  w.document.close();

}

function renderPhotoEditor(){

function rotatePhotoEditor(){
  const pe = STATE.ui.photoEditor;
  if(!pe) return;
  pe.rotation = (pe.rotation + 90) % 360;
  photoEditorCrop = null;
  drawPhotoEditorCanvas();
}
function resetPhotoEditorCrop(){ photoEditorCrop = null; drawPhotoEditorCanvas(); }
function initPhotoEditorCanvas(){
  const pe = STATE.ui.photoEditor;
  const canvas = document.getElementById("peCanvas");
  if(!pe || !canvas) return;

  let dragging = false, startX = 0, startY = 0;
  const getPos = (ev)=>{
    const rect = canvas.getBoundingClientRect();
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    const x = (cx-rect.left) * (canvas.width/rect.width), y = (cy-rect.top) * (canvas.height/rect.height);
    return { x: Math.max(0, Math.min(canvas.width, x)), y: Math.max(0, Math.min(canvas.height, y)) };
  };
  canvas.onpointerdown = (ev)=>{
    if(!pe.ready) return;
    dragging = true;
    const p = getPos(ev);
    startX = p.x; startY = p.y;
    photoEditorCrop = { x:startX, y:startY, w:0, h:0 };
    canvas.setPointerCapture && canvas.setPointerCapture(ev.pointerId);
  };
  canvas.onpointermove = (ev)=>{
    if(!dragging) return;
    const p = getPos(ev);
    photoEditorCrop = {
      x: Math.min(startX,p.x), y: Math.min(startY,p.y),
      w: Math.abs(p.x-startX), h: Math.abs(p.y-startY)
    };
    drawPhotoEditorCanvas();
  };
  canvas.onpointerup = ()=>{ dragging = false; };
  canvas.onpointercancel = ()=>{ dragging = false; };

  // The canvas element is recreated on every re-render (innerHTML is rebuilt
  // from scratch). If we already successfully loaded this exact image in a
  // previous pass, just redraw from the cached Image object instead of
  // fetching it again and re-running the whole load/error dance.
  if(photoEditorImg && photoEditorImg.src === pe.url && photoEditorImg.complete && photoEditorImg.naturalWidth){
    drawPhotoEditorCanvas();
    return;
  }
  // Don't auto-retry forever if it already failed once — let the person
  // close and reopen the editor (or we'd spam network requests on every
  // unrelated re-render while the error is showing).
  if(pe._attempted && STATE.ui.photoEditorError) return;
  pe._attempted = true;

  const onReady = ()=>{
    if(STATE.ui.photoEditor!==pe) return;
    pe.ready = true;
    photoEditorCrop = null;
    drawPhotoEditorCanvas();
    // Flip the toolbar live instead of calling render(), which would
    // recreate this very canvas and restart the whole load again.
    document.querySelectorAll(".pe-toolbar button").forEach(b=>{ b.disabled = false; });
    const spinner = document.querySelector(".pe-loading");
    if(spinner) spinner.remove();
  };
  photoEditorImg = new Image();
  photoEditorImg.crossOrigin = "anonymous";
  photoEditorImg.onload = onReady;
  photoEditorImg.onerror = ()=>{
    // The storage server may not be sending CORS headers, which makes a
    // crossOrigin-mode load fail outright even though the photo itself is
    // perfectly reachable. Fall back to a plain (non-CORS) load so the
    // person can at least view/rotate it — cropping that particular photo
    // will still show a clear error at save time if the canvas ends up
    // tainted, instead of failing to even open here.
    const fallback = new Image();
    fallback.onload = ()=>{ photoEditorImg = fallback; onReady(); };
    fallback.onerror = ()=>{ if(STATE.ui.photoEditor!==pe) return; STATE.ui.photoEditorError = t().photoLoadError; renderPhotoEditor(); };
    fallback.src = pe.url;
  };
  photoEditorImg.src = pe.url;
}
function drawPhotoEditorCanvas(){
  const canvas = document.getElementById("peCanvas");
  const pe = STATE.ui.photoEditor;
  if(!canvas || !photoEditorImg || !photoEditorImg.naturalWidth || !pe) return;
  const ctx = canvas.getContext("2d");
  const swap = pe.rotation===90 || pe.rotation===270;
  const iw = photoEditorImg.naturalWidth, ih = photoEditorImg.naturalHeight;
  const maxW = Math.min(window.innerWidth-32, 520);
  const maxH = Math.min(window.innerHeight*0.5, 480);
  const baseW = swap ? ih : iw, baseH = swap ? iw : ih;
  const scale = Math.min(maxW/baseW, maxH/baseH, 1);
  canvas.width = Math.round(baseW*scale);
  canvas.height = Math.round(baseH*scale);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate((pe.rotation*Math.PI)/180);
  const drawW = iw*scale, drawH = ih*scale;
  ctx.drawImage(photoEditorImg, -drawW/2, -drawH/2, drawW, drawH);
  ctx.restore();
  const c = photoEditorCrop;
  if(c && c.w>4 && c.h>4){
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, canvas.width, c.y);
    ctx.fillRect(0, c.y+c.h, canvas.width, canvas.height-(c.y+c.h));
    ctx.fillRect(0, c.y, c.x, c.h);
    ctx.fillRect(c.x+c.w, c.y, canvas.width-(c.x+c.w), c.h);
    ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 2;
    ctx.strokeRect(c.x, c.y, c.w, c.h);
  }
}
function peShowError(msg){
  STATE.ui.photoEditorSaving = false;
  STATE.ui.photoEditorError = msg;
  renderPhotoEditor();
}
function savePhotoEditor(){
  const pe = STATE.ui.photoEditor;
  if(!pe || STATE.ui.photoEditorSaving) return;
  if(!photoEditorImg || !photoEditorImg.naturalWidth){
    peShowError(t().photoLoadError);
    return;
  }
  let dataUrl;
  try{
    const canvas = document.getElementById("peCanvas");
    const cw = canvas ? canvas.width : 0, ch = canvas ? canvas.height : 0;
    const swap = pe.rotation===90 || pe.rotation===270;
    const iw = photoEditorImg.naturalWidth, ih = photoEditorImg.naturalHeight;
    const baseW = swap ? ih : iw, baseH = swap ? iw : ih;
    const k = Math.min(1, 1600/Math.max(baseW, baseH));
    const fw = Math.max(1, Math.round(baseW*k)), fh = Math.max(1, Math.round(baseH*k));

    const full = document.createElement("canvas");
    full.width = fw; full.height = fh;
    const fctx = full.getContext("2d");
    fctx.translate(fw/2, fh/2);
    fctx.rotate((pe.rotation*Math.PI)/180);
    fctx.drawImage(photoEditorImg, -iw*k/2, -ih*k/2, iw*k, ih*k);

    const c = photoEditorCrop;
    const useCrop = c && c.w>4 && c.h>4 && cw>0 && ch>0;
    let sx = 0, sy = 0, sw = fw, sh = fh;
    if(useCrop){
      const rx = fw/cw, ry = fh/ch;
      sx = Math.max(0, Math.round(c.x*rx)); sy = Math.max(0, Math.round(c.y*ry));
      sw = Math.min(fw-sx, Math.round(c.w*rx)); sh = Math.min(fh-sy, Math.round(c.h*ry));
      if(sw<1 || sh<1){ sx=0; sy=0; sw=fw; sh=fh; }
    }
    const out = document.createElement("canvas");
    out.width = sw; out.height = sh;
    out.getContext("2d").drawImage(full, sx, sy, sw, sh, 0, 0, sw, sh);
    dataUrl = out.toDataURL("image/jpeg", 0.88);
  }catch(err){
    console.error("MaintOS: savePhotoEditor crop/export failed", err);
    peShowError((err && err.name==="SecurityError") ? t().photoCropCorsError : t().photoSaveError);
    return;
  }
  finishSavePhotoEditor(dataUrl);
}
async function finishSavePhotoEditor(dataUrl){
  const pe = STATE.ui.photoEditor;
  if(!pe) return;
  STATE.ui.photoEditorSaving = true;
  STATE.ui.photoEditorError = "";
  renderPhotoEditor();
  try{
    let url = dataUrl;
    if(sb){
      const blob = blobFromDataURL(dataUrl);
      const file = new File([blob], "photo.jpg", { type:"image/jpeg" });
      url = await uploadToStorage("machine-photos", file);
    }
    const m = STATE.machines.find(x=>x.id===pe.machineId);

      const ok = await updateMachine(pe.machineId, { photos:newPhotos });

      if(STATE.ui.lightbox && STATE.ui.lightbox.machineId===pe.machineId){

      }
    }
    photoEditorImg = null;
    STATE.ui.photoEditor = null;
    STATE.ui.photoEditorSaving = false;
    renderPhotoEditor();
    render();
  }catch(err){
    console.error("MaintOS: savePhotoEditor failed", err);
    const detail = err && err.message ? " ("+err.message+")" : "";
    peShowError(t().photoSaveError + detail);
  }
}
function initLightboxGestures(){
  const img = document.getElementById("lbImg");
  if(!img) return;
  lbApplyTransform();
  let dragging = false, startX=0, startY=0, startTX=0, startTY=0;
  let pinchStartDist = 0, pinchStartScale = 1;

  img.onpointerdown = (ev)=>{
    if(lbZoom.scale<=1) return;
    dragging = true;
    startX = ev.clientX; startY = ev.clientY;
    startTX = lbZoom.x; startTY = lbZoom.y;
    img.setPointerCapture && img.setPointerCapture(ev.pointerId);
  };
  img.onpointermove = (ev)=>{
    if(!dragging) return;
    lbZoom.x = startTX + (ev.clientX - startX);
    lbZoom.y = startTY + (ev.clientY - startY);
    lbApplyTransform();
  };
  img.onpointerup = ()=>{ dragging = false; };
  img.onpointercancel = ()=>{ dragging = false; };

  img.onwheel = (ev)=>{
    ev.preventDefault();
    const delta = ev.deltaY < 0 ? 0.2 : -0.2;
    lbZoom.scale = Math.min(4, Math.max(1, lbZoom.scale + delta));
    if(lbZoom.scale===1){ lbZoom.x=0; lbZoom.y=0; }
    lbApplyTransform();
  };

  img.addEventListener("touchstart", (ev)=>{
    if(ev.touches.length===2){
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      pinchStartDist = Math.sqrt(dx*dx+dy*dy);
      pinchStartScale = lbZoom.scale;
    }
  }, {passive:true});
  img.addEventListener("touchmove", (ev)=>{
    if(ev.touches.length===2){
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(pinchStartDist>0){
        lbZoom.scale = Math.min(4, Math.max(1, pinchStartScale * (dist/pinchStartDist)));
        if(lbZoom.scale===1){ lbZoom.x=0; lbZoom.y=0; }
        lbApplyTransform();
      }
    }
  }, {passive:true});
}

async function startRecording(target){
  STATE.ui.micError = "";
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    audioChunks = [];
    mr.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
    mr.onstop = async () => {
      const blob = new Blob(audioChunks, {type:"audio/webm"});
      stream.getTracks().forEach(tr=>tr.stop());
      clearInterval(recordTimer);
      STATE.ui.elapsed = 0;

      let url = null;
      try{
        if(sb){
          const file = new File([blob], "voice-"+Date.now()+".webm", {type:"audio/webm"});
          url = await uploadToStorage("voice-notes", file);
        } else {
          url = await new Promise((res)=>{
            const reader = new FileReader();
            reader.onloadend = ()=>res(reader.result);
            reader.readAsDataURL(blob);
          });
        }
      }catch(err){
        console.error("MaintOS: voice note upload failed", err);
        STATE.ui.micError = t().micError;
        render();
        return;
      }

      if(target === "chat"){
        const localMsg = { id:"c"+Date.now(), fromId:STATE.currentUser.id, toId:STATE.ui.selectedChatUserId, type:"audio", content:url, createdAt:new Date().toISOString() };
        STATE.chat.push(localMsg);
        render();
        if(sb){
          try{
            await sb.from("chat_messages").insert({ from_id:STATE.currentUser.id, to_id:STATE.ui.selectedChatUserId, kind:"audio", content:url });
            await fetchChat();
            render();
          }catch(err){ console.error("MaintOS: send voice chat message failed", err); }
        }
      } else {
        const localNote = { id:"h"+Date.now(), authorId:STATE.currentUser.id, authorName:STATE.currentUser.name, type:"audio", content:url, shift:STATE.ui.handoverShift, createdAt:new Date().toISOString() };
        STATE.handover.unshift(localNote);
        render();
        if(sb){
          try{
            await sb.from("handover_notes").insert({ author_id:STATE.currentUser.id, kind:"audio", content:url, shift:STATE.ui.handoverShift });
            await fetchHandover();
            render();
          }catch(err){ console.error("MaintOS: send voice handover note failed", err); }
        }
      }
    };
    mediaRecorder = mr;
    mr.start();
    STATE.ui.recording = true;
    STATE.ui.recordTarget = target;
    render();
    recordTimer = setInterval(()=>{
      STATE.ui.elapsed++;
      const el = document.getElementById("rec-timer");
      if(el){
        const m = String(Math.floor(STATE.ui.elapsed/60)).padStart(2,"0");
        const s = String(STATE.ui.elapsed%60).padStart(2,"0");
        el.textContent = m+":"+s;
      }
    }, 1000);
  } catch(err){
    STATE.ui.micError = t().micError;
    render();
  }
}

let personFormSaving = false;
async function savePersonForm(){
  const T_ = t();
  const f = STATE.ui.personForm;
  const isEdit = STATE.ui.personMode === "edit";
  if(!f.name.trim() || !f.joinDate || (!isEdit && (!f.email.trim() || !f.password.trim()))){
    f.error = T_.fillPersonFields; render(); return;
  }
  if(f.password.trim() && f.password.trim().length < 6){
    f.error = T_.passwordTooShort; render(); return;
  }
  if(personFormSaving) return;
  personFormSaving = true;
  f.error = "";
  f.saving = true;
  render();
  if(isEdit){
    try{
      await updatePerson(STATE.ui.selectedPersonId, { name:f.name.trim(), role:f.role, password:f.password.trim(), joinDate:f.joinDate, photo:f.photo });
      STATE.ui.personMode = "view";
    }catch(err){
      console.error("MaintOS: updatePerson failed", err);
      f.error = T_.personCreateFailed + (err && err.message ? " ("+err.message+")" : "");
      f.saving = false;
    }
    personFormSaving = false;
    render();
  } else {
    const result = await addPerson({ name:f.name.trim(), role:f.role, password:f.password.trim(), email:f.email.trim(), joinDate:f.joinDate, photo:f.photo });
    personFormSaving = false;
    if(result && result.ok){
      STATE.ui.personMode = "view";
      STATE.ui.selectedPersonId = null;
      render();
    } else {
      f.saving = false;
      f.error = T_.personCreateFailed + (result && result.err && result.err.message ? " ("+result.err.message+")" : "");
      render();
    }
  }
}

    } else {
      listHtml = interventions.map(o=>{
        return '<div class="intervention-card"><p class="title">'+esc(o.title)+'</p>' +
          '<div class="meta"><span class="mono">'+icon("clock",12)+fmtDateTime(o.finishedAt)+'</span>' +
          '<span>'+icon("checkCircle",12)+stepsTotal(o)+'/'+stepsTotal(o)+' '+T_.stepsProgress+'</span></div></div>';
      }).join("");
    }
    interventionsBlock = '<p class="section-label">'+T_.interventionHistory+' ('+interventions.length+')</p>' + listHtml;
  }

  return '<div class="tab-content">' +
    '<div class="person-detail-head">' + avatar +
      '<p class="name">'+esc(p.name)+'</p>' +
      '<span class="role-tag">'+(p.role==="manager"?T_.manager:T_.technician)+'</span>' +
      '<p class="since">'+icon("clock",12)+T_.memberSince+' '+fmtDate(p.joinDate)+'</p>' +
    '</div>' +
    '<div class="person-detail-actions">' +
      '<button class="pd-btn" onclick="openPersonEdit()">'+icon("pencil",13)+T_.editPerson+'</button>' +
      (isSelf ? '' : '<button class="pd-btn danger" onclick="showConfirmDeletePerson()">'+icon("trash",13)+T_.deletePerson+'</button>') +
    '</div>' +
    confirmBlock + interventionsBlock +
  '</div>';
}

/* ============================================================
   INIT
============================================================ */
/* Prevent any touch gesture outside the designated scroll areas from moving
   the page (belt-and-suspenders against iOS Safari's rubber-band scroll). */
document.addEventListener("touchmove", function(e){
  if(!e.target.closest(".tab-content, .photo-editor-overlay, .he-overlay, .asst-overlay, .notes-list, .notif-list, .login-sheet, textarea, input, .chip-row, .filter-row, .step-add-row, .chat-messages, .contact-list")){
    e.preventDefault();
  }
}, { passive: false });

/* Register the service worker for offline app-shell loading. Only works when
   this file is actually hosted (http/https or localhost) — browsers block
   service workers on file:// for security reasons, so this silently no-ops
   there and the app still works fine via the IndexedDB persistence above. */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

/* Online/offline detection */
STATE.ui.isOnline = navigator.onLine;
window.addEventListener("online", async ()=>{
  STATE.ui.isOnline = true;
  render();
  await replayOutbox();
  if(STATE.currentUser){
    await fetchAllAppData();
    subscribeRealtime();
  } else {
    await fetchProfiles();
  }
  render();
});
window.addEventListener("offline", ()=>{
  STATE.ui.isOnline = false;
  render();
});

/* Phones commonly suspend background tabs (screen lock, app-switching),
   which silently drops the realtime WebSocket without firing "offline".
   Whenever the app comes back to the foreground, pull fresh data and make
   sure realtime is still actually connected — this is what fixes "I have
   to manually refresh to see new data" on mobile. */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    resyncIfStale();
  }
});
window.addEventListener("pageshow", (e)=>{
  if(e.persisted) resyncIfStale();
});

/* Boot sequence:
   1. Paint instantly from whatever was cached locally last time (works
      offline, or while the network round-trip below is in flight).
   2. Ask Supabase who's logged in. If nobody, just refresh the account
      list so the picker is current. If someone is, load all their data
      and start realtime sync. */
(async function initApp(){
  await hydrateFromDB();
  render();

  if(!sb){
    STATE.ui.bootError = t().aiErrorNetwork;
    render();
    return;
  }

  try{
    const { data: { session } } = await sb.auth.getSession();
    await fetchProfiles();
    if(session && session.user){
      const u = STATE.users.find(x=>x.id===session.user.id);
      if(u){
        STATE.currentUser = u;
        await fetchAllAppData();
        subscribeRealtime();
        replayOutbox();
        syncPushSubscription();
      }
    }
  }catch(err){
    console.error("MaintOS: boot failed, showing locally cached data", err);
  }
  render();
})();
</script>
